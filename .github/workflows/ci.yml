name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Guards the crawlable-entity, accessibility, and DOM contracts.
      - name: Contract checks
        run: npm run check

      # Enforces the house code style (Prettier, pinned).
      - name: Formatting
        run: npm run format:check
